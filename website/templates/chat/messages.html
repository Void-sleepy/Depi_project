<section class="messages" x-ref="messages">
  <div class="empty-state" x-show="messages.length === 0 && !isLoading">
    <h1 class="empty-title">DevDocs AI</h1>
    <p class="empty-tagline">Ask anything about your AI documentation.</p>
  </div>

  <template x-for="msg in messages" :key="msg.id">
    <div class="message-row" :class="msg.role">
      <div class="message-block">
        <div class="bubble" :class="msg.role">
          <div class="bubble-content" x-html="msg.html"></div>
        </div>

        <div class="sources-panel" x-show="msg.role === 'assistant' && msg.sources && msg.sources.length && !msg.content.endsWith('▋')">
          <div class="sources-label">Sources</div>
          <div class="sources-grid">
            <template x-for="(src, idx) in msg.sources" :key="idx">
              <div class="source-card">
                <div class="source-filename" x-text="formatSourceName(src)"></div>
                <div class="source-excerpt" x-show="formatSourceExcerpt(src)" x-text="formatSourceExcerpt(src)"></div>
              </div>
            </template>
          </div>
        </div>

        <div class="latency" x-show="msg.role === 'assistant' && msg.latency" x-text="'answered in ' + msg.latency + 'ms'"></div>
        <div class="message-time" x-show="msg.role === 'user'" x-text="msg.timestamp"></div>
      </div>
    </div>
  </template>

  <div class="typing-indicator" x-show="isLoading" aria-label="Assistant is typing">
    <span></span><span></span><span></span>
  </div>
</section>
