<div class="input-area">
  <div class="input-wrapper">
    <textarea
      x-ref="textarea"
      x-model="inputText"
      @input="grow($refs.textarea)"
      @keydown.ctrl.enter.prevent="sendMessage()"
      @keydown.meta.enter.prevent="sendMessage()"
      placeholder="Ask a question about your documentation…"
      :disabled="isLoading"
      rows="1"
    ></textarea>
    <button type="button" class="send-btn" @click="sendMessage()" :disabled="isLoading || !inputText.trim()" aria-label="Send">
      <i data-lucide="arrow-up"></i>
    </button>
  </div>
  <p class="input-hint">Ctrl+Enter to send · answers are grounded in documentation</p>
</div>
