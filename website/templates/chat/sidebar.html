<aside class="sidebar" :class="{ open: sidebarOpen }">
  <div class="sidebar-header">
    <a href="/" class="sidebar-logo">DevDocs AI</a>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme">
      <i data-theme-icon data-lucide="sun"></i>
    </button>
  </div>

  <button class="new-chat-btn" type="button" @click="newChat()">
    <i data-lucide="plus"></i>
    New chat
  </button>

  <div class="sidebar-section">
    <template x-if="sessions.length === 0">
      <p class="empty-history">No chats yet — start a new conversation.</p>
    </template>
    <template x-for="(items, label) in groupedSessions" :key="label">
      <template x-if="items.length">
        <div>
          <div class="section-label" x-text="label"></div>
          <template x-for="session in items" :key="session.id">
            <div class="history-row" :class="{ active: session.id === currentSessionId }">
              <button
                class="history-item"
                type="button"
                @click="loadSession(session.id)"
                x-text="session.title"
              ></button>
              <button
                class="history-delete"
                type="button"
                @click.stop="deleteSession(session.id)"
                aria-label="Delete chat"
              >
                <i data-lucide="trash-2"></i>
              </button>
            </div>
          </template>
        </div>
      </template>
    </template>
  </div>

  <div class="sidebar-footer">
    <span class="status-dot" :class="apiStatus"></span>
    <span x-text="apiStatusLabel"></span>
  </div>
</aside>
